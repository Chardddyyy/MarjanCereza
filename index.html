<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Marjan Cereza</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&family=Pinyon+Script&display=swap">
<style>
/* Layout: soft blush page, script name over a rotating ring monogram, glassy cards, sparkle trail following the cursor */
:root {
  --bg: #fff4f8;
  --bg2: #fde3ee;
  --ink: #3b1d34;
  --muted: #7a5670;
  --rose: #d1457a;
  --rose-soft: #f6bfd5;
  --lilac: #e7d9f6;
  --card: rgba(255,255,255,.66);
  --line: rgba(160,60,115,.2);
  --on-rose: #ffffff;
  --glow: rgba(255,150,190,.35);
  --display: "Cormorant Garamond", Georgia, serif;
  --body: "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
  --script: "Pinyon Script", "Brush Script MT", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c0e19; --bg2: #2b1626; --ink: #fbe7f0; --muted: #cba5ba; --rose: #ff7ba9; --rose-soft: #6b2a4b;
    --lilac: #3a2550; --card: rgba(255,255,255,.06); --line: rgba(255,170,205,.22); --on-rose: #2a0f20; --glow: rgba(255,110,170,.28);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c0e19; --bg2: #2b1626; --ink: #fbe7f0; --muted: #cba5ba; --rose: #ff7ba9; --rose-soft: #6b2a4b;
  --lilac: #3a2550; --card: rgba(255,255,255,.06); --line: rgba(255,170,205,.22); --on-rose: #2a0f20; --glow: rgba(255,110,170,.28);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background:
    radial-gradient(60rem 40rem at 90% -10%, var(--lilac), transparent 60%),
    radial-gradient(50rem 40rem at -10% 20%, var(--bg2), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  overflow-x: hidden;
}
.script { font-family: var(--script); font-weight: 400; }
h1, h2, h3, p, ul, ol { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; border-radius: 6px; }

#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }
#glow {
  position: fixed; left: 0; top: 0; width: 360px; height: 360px; margin: -180px 0 0 -180px;
  border-radius: 50%; pointer-events: none; z-index: 1;
  background: radial-gradient(circle, var(--glow), transparent 65%);
  opacity: 0; transition: opacity .4s; will-change: transform;
}
#glow.on { opacity: 1; }

/* ---------- PIN gate ---------- */
#gate { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding-block: 32px; position: relative; z-index: 2; }
.gate-card {
  width: 100%; max-width: 380px; text-align: center; padding: 36px 24px 28px;
  background: var(--card); border: 1px solid var(--line); border-radius: 28px;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 24px 60px -30px var(--rose);
}
.gate-card .script { font-size: 3.4rem; line-height: 1.1; color: var(--rose); }
.gate-card .sub { color: var(--muted); margin-top: 6px; font-size: .95rem; }
.eyebrow { font-size: .78rem; letter-spacing: .22em; text-transform: uppercase; color: var(--rose); font-weight: 500; }
.dots { display: flex; justify-content: center; gap: 12px; margin: 22px 0 8px; }
.dots span { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--rose); transition: background .15s, transform .15s; }
.dots span.fill { background: var(--rose); transform: scale(1.15); }
.dots.shake { animation: shake .45s; }
.msg { min-height: 1.5em; font-size: .88rem; color: var(--rose); margin-bottom: 8px; }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 270px; margin: 0 auto; }
.pad button {
  font: 500 1.35rem var(--body); color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 50%; aspect-ratio: 1; cursor: pointer;
  transition: background .15s, transform .12s, color .15s;
}
.pad button:hover { background: var(--rose-soft); }
.pad button:active { transform: scale(.92); background: var(--rose); color: var(--on-rose); }
.pad .del { font-size: 1rem; }
.pad .blank { visibility: hidden; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }

/* ---------- Site ---------- */
#site { position: relative; z-index: 2; max-width: 1080px; margin: 0 auto; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  padding: 12px 0;
}
.topbar::before { content: ""; position: absolute; inset: 0 -50vw; z-index: -1; background: color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { font-size: 2rem; line-height: 1; text-decoration: none; color: var(--rose); }
.topbar nav { display: flex; gap: 4px 18px; flex-wrap: wrap; }
.topbar nav a { text-decoration: none; font-size: .9rem; color: var(--muted); padding: 4px 0; background: linear-gradient(var(--rose), var(--rose)) 0 100% / 0 2px no-repeat; transition: background-size .25s, color .2s; }
.topbar nav a:hover { color: var(--ink); background-size: 100% 2px; }

.hero { display: grid; grid-template-columns: 1.25fr 1fr; gap: 32px; align-items: center; padding: 56px 0 40px; }
.hero > * { min-width: 0; }
.hero-copy > * { animation: rise .8s both; }
.hero-copy > :nth-child(2) { animation-delay: .1s; } .hero-copy > :nth-child(3) { animation-delay: .2s; } .hero-copy > :nth-child(4) { animation-delay: .3s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.name { font-size: clamp(3.6rem, 11vw, 7rem); line-height: 1.02; color: var(--rose); margin: 8px 0 12px; text-wrap: balance; }
.lead { font-family: var(--display); font-style: italic; font-size: clamp(1.3rem, 3vw, 1.7rem); line-height: 1.4; color: var(--ink); max-width: 30em; }
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }
.btn { text-decoration: none; padding: 12px 24px; border-radius: 999px; font-weight: 500; font-size: .95rem; transition: transform .2s, box-shadow .2s, background .2s; }
.btn.primary { background: var(--rose); color: var(--on-rose); box-shadow: 0 10px 24px -12px var(--rose); }
.btn.ghost { border: 1px solid var(--rose); color: var(--rose); }
.btn:hover { transform: translateY(-2px); }
.btn.ghost:hover { background: var(--rose-soft); }

.hero-mark { position: relative; width: 100%; max-width: 340px; aspect-ratio: 1; margin: 0 auto; }
.ring { position: absolute; inset: 0; width: 100%; height: 100%; animation: spin 40s linear infinite; }
.ring text { font: 500 13.5px var(--body); letter-spacing: .22em; fill: var(--rose); }
@keyframes spin { to { transform: rotate(360deg); } }
.monogram {
  position: absolute; inset: 17%; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 30% 25%, #fff 0%, var(--rose-soft) 55%, var(--rose) 130%);
  box-shadow: 0 30px 60px -30px var(--rose), inset 0 0 0 6px rgba(255,255,255,.35);
}
.monogram span { font-size: clamp(4rem, 14vw, 6.4rem); line-height: 1; color: #fff; text-shadow: 0 4px 18px rgba(120,20,70,.35); }

.section { padding: 52px 0 8px; scroll-margin-top: 70px; }
.h2 { font-family: var(--display); font-weight: 600; font-size: clamp(2rem, 5vw, 2.8rem); line-height: 1.15; color: var(--ink); margin-bottom: 22px; display: flex; align-items: center; gap: 16px; text-wrap: balance; }
.h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
.h3 { font-family: var(--display); font-weight: 600; font-size: 1.4rem; margin-bottom: 8px; }
.about-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 24px; }
.about-text { color: var(--muted); max-width: 62ch; }

.timeline { list-style: none; padding: 0; display: grid; gap: 18px; position: relative; padding-left: 26px; }
.timeline::before { content: ""; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 2px; background: linear-gradient(var(--rose), var(--line)); border-radius: 2px; }
.job, .edu, .pills li {
  background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px 24px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: transform .15s ease-out, box-shadow .3s, border-color .3s;
  transform: perspective(800px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
  will-change: transform;
}
.job:hover, .edu:hover, .pills li:hover { box-shadow: 0 22px 44px -26px var(--rose); border-color: var(--rose); }
.job { position: relative; }
.job::before { content: ""; position: absolute; left: -26px; top: 30px; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 3px solid var(--rose); }
.job-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.date { font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--rose); font-weight: 500; font-variant-numeric: tabular-nums; }
.badge { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; background: var(--rose); color: var(--on-rose); padding: 2px 10px; border-radius: 999px; }
.job-title { font-family: var(--display); font-weight: 600; font-size: 1.55rem; line-height: 1.25; margin-top: 4px; }
.company { color: var(--muted); display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.tooth { width: 20px; height: 20px; fill: var(--rose); flex: none; }
.job ul { padding-left: 1.1rem; color: var(--muted); display: grid; gap: 2px; }
.job li::marker { color: var(--rose); }

.pills { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 12px; }
.pills li { padding: 10px 20px; border-radius: 999px; font-size: .95rem; max-width: 100%; }
.langs { margin-top: 28px; }
.chip { display: inline-block; margin: 0 10px 8px 0; padding: 6px 18px; border-radius: 999px; background: var(--lilac); color: var(--ink); font-weight: 500; font-size: .92rem; }

.edu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px; }
.edu > * { min-width: 0; }

.contact-list { margin-top: 18px; display: grid; gap: 12px; max-width: 560px; }
.contact-row { display: grid; grid-template-columns: 70px 1fr auto; gap: 12px; align-items: center; padding: 14px 18px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
.label { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--rose); font-weight: 500; }
.value { min-width: 0; overflow-wrap: anywhere; text-decoration: none; font-weight: 500; }
.value:hover { color: var(--rose); }
.copy { font: 500 .82rem var(--body); color: var(--rose); background: transparent; border: 1px solid var(--rose); border-radius: 999px; padding: 6px 14px; cursor: pointer; transition: background .2s, color .2s; }
.copy:hover, .copy.done { background: var(--rose); color: var(--on-rose); }

.foot { margin-top: 64px; padding: 26px 0 40px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: .88rem; }
.foot .script { font-size: 1.9rem; color: var(--rose); }

@media (max-width: 760px) {
  .hero { grid-template-columns: 1fr; padding-top: 32px; }
  .hero-mark { max-width: 260px; order: -1; }
  .topbar nav { gap: 2px 14px; }
  .contact-row { grid-template-columns: 1fr auto; }
  .contact-row .label { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .ring, .hero-copy > *, .dots.shake { animation: none; }
  .job, .edu, .pills li { transform: none; transition: none; }
}
</style>

<canvas id="fx" aria-hidden="true"></canvas>
<div id="glow" aria-hidden="true"></div>

<section id="gate" aria-label="Enter PIN">
  <div class="gate-card">
    <p class="eyebrow">Private portfolio</p>
    <h1 class="script">Marjan Cereza</h1>
    <p class="sub">Enter the 6-digit PIN to view</p>
    <div class="dots" id="dots" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <div class="pad" id="pad">
      <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
      <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
      <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
      <button type="button" class="blank" tabindex="-1" aria-hidden="true"></button>
      <button type="button" data-k="0">0</button>
      <button type="button" class="del" data-k="del" aria-label="Delete">⌫</button>
    </div>
  </div>
</section>

<div id="site" hidden></div>
